name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İmza şifresi var mı?
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD gizli değeri eklenmemiş (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: İmza anahtarını çöz
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PW
      - name: APK derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Teleprompter.apk
          rm -f "$RUNNER_TEMP/release.jks"
          gh release create "apk-${{ github.run_number }}" Teleprompter.apk \
            --title "Teleprompter 1.0.${{ github.run_number }} (Android)" \
            --notes "Android için kurulum dosyası. Telefonda indirip açın; ilk kurulumda 'bilinmeyen kaynaklardan yükleme' izni istenir." \
            --latest
